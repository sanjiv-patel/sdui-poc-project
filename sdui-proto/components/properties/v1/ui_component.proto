syntax = "proto3";

package components.properties.v1;

import "google/protobuf/any.proto";

message SDUIComponent{
    ComponentType type = 1;
    google.protobuf.Any data = 2 ;
}



enum ComponentType{
    BUTTON = 0;
    TEXT = 1;
    IMAGE = 2;
    OFFER_CARD = 3;
    COLUMN = 4;
    ROW = 5;
    GRID = 6;

}