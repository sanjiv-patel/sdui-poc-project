version: v2
inputs:
  - directory: sdui-proto
managed:
  enabled: true
  override:
    - file_option: java_multiple_files
      value: true
    - file_option: java_package_prefix
      value: com.cg.sdui
plugins:
  - remote: buf.build/grpc/java:v1.75.0
    out: platforms/server_java/main/java
  - remote: buf.build/protocolbuffers/java:v32.0
    out: platforms/server_java/main/java
  - remote: buf.build/community/pseudomuto-doc:v1.5.1
    out: dist/sdui/server/docs
    opt: markdown,docs.md,source_relative