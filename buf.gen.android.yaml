version: v2
inputs:
  - directory: sdui-proto
managed:
  enabled: true
  override:
    - file_option: java_multiple_files
      value: true
    - file_option: java_package_prefix
      value: com.cg.sdui
plugins:
  - remote: buf.build/connectrpc/kotlin:v0.7.4
    out: platforms/android-sdui-lib/sdui-lib/src/main/kotlin
  - remote: buf.build/protocolbuffers/kotlin:v32.0
    out: platforms/android-sdui-lib/sdui-lib/src/main/kotlin
  - remote: buf.build/protocolbuffers/java:v27.2
    out: platforms/android-sdui-lib/sdui-lib/src/main/java
  - remote: buf.build/community/pseudomuto-doc:v1.5.1
    out: dist/sdui/android/docs
    opt: markdown,docs.md,source_relative