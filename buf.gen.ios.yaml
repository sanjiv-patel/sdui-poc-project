version: v2
inputs:
  - directory: sdui-proto
managed:
  enabled: true
plugins:
  - remote: buf.build/connectrpc/swift:v1.1.0
    out: dist/platforms/ios/generated
    opt:
      - GenerateAsyncMethods=true
      - GenerateCallbackMethods=false
      - Visibility=Public
  - remote: buf.build/apple/swift:v1.31.0
    out: dist/platforms/ios/generated
    opt: Visibility=Public
  - remote: buf.build/community/pseudomuto-doc:v1.5.1
    out: dist/sdui/ios/docs
    opt: markdown,docs.md,source_relative
